services:
  # FastAPI Backend Web Service
  - type: web
    name: crop-care-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # React Vite Frontend Static Site
  - type: web
    name: crop-care-frontend
    env: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://crop-care-nasa-spaceapps-2026.onrender.com
    routes:
      - type: rewrite
        source: /api/*
        destination: https://crop-care-nasa-spaceapps-2026.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
